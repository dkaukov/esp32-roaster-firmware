; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
lib_deps = 
	Wire
	bblanchon/ArduinoJson@^7.3.0
	etlcpp/Embedded Template Library@^20.38.11
	br3ttb/PID@^1.2.1
	gyverlibs/PWMrelay@^1.2
	https://github.com/drhaney/pt100rtd.git
	https://github.com/budulinek/MAX31865_NonBlocking.git
	mathieucarbou/AsyncTCP@^3.2.3
	mathieucarbou/ESPAsyncWebServer@^3.1.1
	olkal/HX711_ADC@^1.2.12
lib_ignore = 
	ESP32 Azure IoT Arduino
	ESP32 BLE Arduino
	SimpleBLE
	NetBIOS
	Preferences
	BluetoothSerial
monitor_speed = 115200
build_flags = 
	-DCORE_DEBUG_LEVEL=5
	-DMECH_DEBUG=1

[env:esp32doit-devkit-v1]
platform = espressif32 @ 6.8.1
board = esp32doit-devkit-v1
framework = arduino
build_flags = 
	-DCORE_DEBUG_LEVEL=5
	-DMECH_DEBUG=1
board_build.partitions = min_spiffs.csv

[env:lolin_c3_mini]
platform = espressif32
board = lolin_c3_mini
framework = arduino
build_flags = 
	-Os
	-DCORE_DEBUG_LEVEL=5
	-DMECH_DEBUG=1
board_build.partitions = min_spiffs.csv
board_build.variant = nologo_esp32c3_super_mini
upload_protocol = espota
upload_port = rst-544B84.sphere.home
